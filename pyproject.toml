[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molprotx"
version = "1.0.0"
description = "MolProtX 主实验：基于六种本地预训练模型的药物-蛋白结合分类"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=0.34,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "packaging>=24,<27",
  "protobuf>=4.25,<6",
  "PyYAML>=6.0,<7",
  "safetensors>=0.4,<1",
  "scikit-learn>=1.4,<2",
  "sentencepiece>=0.2,<1",
  "tensorboard>=2.16,<3",
  "tokenizers>=0.21,<0.22",
  "torch>=2.2,<2.6",
  "tqdm>=4.66,<5",
  "transformers==4.47.1",
]

[project.scripts]
molprotx-extract-hf = "molprotx.features.hf_extract:main"
molprotx-train = "molprotx.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
