feature_extraction:
  device: cuda
  dtype: float16
  output_dtype: float16
  protein_batch_size: 2
  drug_batch_size: 32
  models:
    esm2:
      model_path: pretrained/esm2_t33_650M_UR50D
      source_id: facebook/esm2_t33_650M_UR50D
      use_safetensors: true
      expected_dim: 1280
      max_length: 1024
      trust_remote_code: false
    prott5:
      model_path: pretrained/prot_t5_xl_uniref50
      source_id: Rostlab/prot_t5_xl_uniref50
      use_safetensors: false
      expected_dim: 1024
      max_length: 1024
      trust_remote_code: false
    ankh:
      model_path: pretrained/ankh-base
      source_id: ElnaggarLab/ankh-base
      use_safetensors: false
      expected_dim: 768
      dtype: float32
      max_length: 1024
      trust_remote_code: false
    molformer:
      model_path: pretrained/MoLFormer-XL-both-10pct
      source_id: ibm-research/MoLFormer-XL-both-10pct
      source_revision: compat-v4
      use_safetensors: true
      expected_dim: 768
      dtype: float32
      max_length: 202
      trust_remote_code: true
    chemberta:
      model_path: pretrained/ChemBERTa-100M-MLM
      source_id: DeepChem/ChemBERTa-100M-MLM
      use_safetensors: true
      expected_dim: 768
      max_length: 510
      trust_remote_code: false
    moldeberta:
      model_path: pretrained/MolDeBERTa-base-123M-mtr
      source_id: SaeedLab/MolDeBERTa-base-123M-mtr
      use_safetensors: true
      expected_dim: 768
      max_length: 128
      trust_remote_code: false

model:
  positional_encoding: none
  positional_scale_init: 1.0
  protein_branch:
    projected_dim: 1024
    first_token_dim: 32
    first_output_dim: 512
    deep_token_dim: 16
    deep_output_dim: 128
    fusion_token_dim: 8
    attention_heads: 1
    attention_weighting: softmax
    fusion_residual_coef: 0.5
    dropout: 0.10
  drug_branch:
    projected_dim: 512
    first_token_dim: 16
    first_output_dim: 256
    deep_token_dim: 8
    deep_output_dim: 64
    fusion_token_dim: 4
    attention_heads: 1
    attention_weighting: softmax
    fusion_residual_coef: 0.5
    dropout: 0.10
  relation_dim: 32
  cross_modal:
    num_layers: 1
    num_heads: 4
    feedforward_multiplier: 4
    dropout: 0.10
  explicit_interaction:
    bilinear_rank: 16
    bilinear_output_dim: 32
    dropout: 0.20
  classifier:
    hidden_dim: 64
    bottleneck_dim: 16
    dropout: 0.20

training:
  device: cuda
  max_epochs: 1000
  batch_size: 256
  eval_batch_size: 512
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  mixed_precision: bf16
  decision_threshold: 0.5
  monitor: val_auprc
  monitor_mode: max
  save_last_checkpoint: true
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 3
    threshold: 0.0001
    threshold_mode: abs
    min_lr: 0.0000001
  early_stopping:
    patience: 20
    min_delta: 0.0001
  ema:
    enabled: true
    decay: 0.999
  warmup:
    enabled: true
    epochs: 5
    start_factor: 0.1
